name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # tools/site/gen.mjs renders the catalog, schema pages, docs, examples
      # and the agent skill, then copies site/ assets, llms.txt and
      # schemas/json so every schema $id
      # (https://rig.works/schemas/<id>.schema.json) still resolves.
      - run: npm run setup
      - name: Build site
        run: npm run check:site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
